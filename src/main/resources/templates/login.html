<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <title>LunarStorage | Login</title>
    <script src="https://unpkg.com/lucide@1.18.0/dist/umd/lucide.min.js" crossorigin="anonymous"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => lucide.createIcons());
    </script>
</head>
<body class="min-h-screen min-w-screen bg-zinc-900 text-gray-200 flex flex-col">
    <header class="w-full">
        <h1 class="text-center text-2xl mt-3">
            <span class="text-shimmer">Lunar</span><span>Storage</span>
        </h1>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center">
        <div>
            <p class="text-[15px] text-gray-400" id="pow-status">login</p>
        </div>

        <div class="h-1 rounded-4xl w-[40%] sm:w-[10%] bg-purple-500 my-4"></div>

        <div class="sm:w-[20%] w-[50%] flex flex-col">
            <a class="bg-[#5865F2] w-full h-10 flex items-center justify-center" th:href="@{/oauth2/authorization/discord}" th:if="${discord_enabled}">
                <img th:src="@{/assets/discord_logo_white.svg}" alt="discord logo" class="h-5 w-auto" />
            </a>
        </div>
    </main>

    <footer class="w-full p-4 text-center text-gray-500 text-sm ">
        <p>&copy; <span th:text="${year}"></span> LunarStorage</p>
    </footer>
</body>
</html>
