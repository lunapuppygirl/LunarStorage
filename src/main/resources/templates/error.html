<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LunarStorage | Error</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="min-h-screen min-w-screen bg-zinc-900 text-gray-200 flex flex-col">
    <header class="w-full">
        <h1 class="text-center text-2xl mt-3">
            <span class="text-shimmer">Lunar</span><span>Storage</span>
        </h1>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center">
        <p class="text-2xl">There was an error!</p>
        <p class="text-red-500" th:text="'Code ' + ${code}"></p>
    </main>

    <footer class="w-full p-4 text-center text-gray-500 text-sm ">
        <p>&copy; <span th:text="${year}"></span> LunarStorage</p>
    </footer>
</body>
</html>
